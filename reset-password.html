<!doctype html><html lang="hy"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyroxHub — Գաղտնաբառի վերականգնում</title><link rel="stylesheet" href="css/style.css"></head><body><div class="ambient"></div><main style="min-height:100vh;display:grid;place-items:center;padding:24px"><section class="modal-box" style="width:min(500px,100%)"><div class="auth-brand"><div class="auth-logo">N</div><strong>Nyrox<span>Hub</span></strong></div><span class="eyebrow">PASSWORD RECOVERY</span><h3>Ստեղծիր նոր գաղտնաբառ</h3><p class="muted">Մուտքագրիր նոր գաղտնաբառը։</p><label>Նոր գաղտնաբառ<input id="password" type="password" minlength="8" placeholder="Առնվազն 8 նիշ"></label><label>Կրկնել գաղտնաբառը<input id="confirm" type="password" minlength="8" placeholder="Կրկին մուտքագրիր"></label><button class="btn primary full" id="save">Փոխել գաղտնաբառը</button><p id="msg" class="muted"></p></section></main><script>const API='https://nyroxhub-store.onrender.com';const token=new URLSearchParams(location.search).get('token');document.querySelector('#save').onclick=async()=>{const p=document.querySelector('#password').value,c=document.querySelector('#confirm').value,m=document.querySelector('#msg');if(!token)return m.textContent='Վերականգնման հղումը չկա։';if(p.length<8)return m.textContent='Գաղտնաբառը պետք է լինի առնվազն 8 նիշ։';if(p!==c)return m.textContent='Գաղտնաբառերը չեն համընկնում։';try{const r=await fetch(API+'/api/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:p})}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent='Գաղտնաբառը փոխվեց ✓ Այժմ կարող ես մուտք գործել։';document.querySelector('#save').disabled=true}catch(e){m.textContent=e.message||'Սխալ տեղի ունեցավ։'}};</script></body></html>
